<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Simplified icon.svg for 16px and 32px: full-bleed square and plain
       pixel-aligned cards, so the grid stays legible at toolbar size. -->
  <rect width="16" height="16" rx="3" fill="#222"/>
  <rect x="2" y="3" width="5" height="4" rx="0.5" fill="#ddd"/>
  <rect x="9" y="3" width="5" height="4" rx="0.5" fill="#ddd"/>
  <rect x="2" y="9" width="5" height="4" rx="0.5" fill="#ddd"/>
  <rect x="9" y="9" width="5" height="4" rx="0.5" fill="#ddd" opacity="0.5"/>
</svg>
